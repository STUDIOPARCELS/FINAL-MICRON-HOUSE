<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#fff}
.card{position:relative;width:941px;height:1672px;overflow:hidden;background:#f4f3ef url(cardstock.webp) center/cover no-repeat;font-family:Montserrat,Arial,sans-serif;color:#3f2448}
.caps{text-transform:uppercase}
.lab{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#6a5571;font-weight:700}
.col{position:absolute;left:148px;right:150px;top:177px;bottom:190px;display:flex;flex-direction:column;gap:34px}
.media{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.media img{flex:1;min-height:0;width:100%;object-fit:cover;box-shadow:0 1px 1px rgba(16,16,16,.18),0 6px 18px rgba(16,16,16,.10)}
</style></head><body><div class="card"><div class="col"><div class="media" data-m="media"></div><div data-m="txt">
<div class="lab">A collaborative rollout</div>
<div class="caps" style="margin-top:12px;font-size:42px;line-height:1.04;letter-spacing:-.01em;font-weight:800">Micron&#8217;s opportunity:<br>shape how autonomy<br>reaches Boise.</div>
<div style="margin-top:14px;font-size:23px;line-height:1.3;font-weight:500;color:#6a5571">With Tesla and university, hospital and<br>Capitol leaders.</div>
<div class="caps" style="margin-top:10px;font-size:19px;letter-spacing:.12em;font-weight:800">A blueprint for other cities.</div>
<div style="margin-top:20px;border-top:1px solid #d3cdc4;padding-top:14px">
<div class="lab" style="font-size:13px">Groundwork</div>
<div style="margin-top:6px;font-size:20px;line-height:1.3;font-weight:600">Cybercab fleet application submitted.<br>Idaho and Boise policy work underway.</div></div></div></div></div><script>
document.fonts.ready.then(()=>{
const m=document.querySelector('.media'),W=m.clientWidth,H=m.clientHeight,P='#3f2448',C='#6a5571',BG='#f4f1eb';
const cx=W/2,cy=H*0.36,R=W*0.355;
const pt=(x0,y0,r,a)=>[x0+r*Math.cos(a*Math.PI/180),y0+r*Math.sin(a*Math.PI/180)];
const T=(x,y,t,o)=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="Montserrat" font-weight="${o.w||800}" font-size="${o.s||17}" letter-spacing="${o.ls||3.4}" fill="${o.f||P}" ${o.op?`fill-opacity="${o.op}"`:''} ${o.f=='#f4f1eb'?'':'stroke="#f1ede7" stroke-width="7" paint-order="stroke" stroke-linejoin="round"'}>${t}</text>`;
let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
s+=`<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse" x="${cx%32}" y="${cy%32}"><path d="M32 0H0V32" fill="none" stroke="${P}" stroke-opacity=".07"/></pattern></defs>`;
s+=`<rect width="${W}" height="${H}" fill="url(#g)"/><rect x=".5" y=".5" width="${W-1}" height="${H-1}" fill="none" stroke="${P}" stroke-opacity=".3"/>`;
s+=T(22,34,'BOISE',{s:11,w:700,ls:3,f:C,a:'start'});
const angs=[-90,-18,54,126,198];
const nodes=[['MICRON',-90,1],['TESLA',-18,0],['HOSPITAL',54,0],['UNIVERSITY',126,0],['CAPITOL',198,0]];
// trunk + branches to other cities
const my=H*0.835, mr=W*0.072, mx=[W*0.2,W*0.5,W*0.8], by=H*0.71;
s+=`<g stroke="${P}" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 6" fill="none"><path d="M${cx} ${cy+R} V${by} M${mx[0]} ${by} H${mx[2]} M${mx[0]} ${by} V${my-mr} M${mx[1]} ${by} V${my-mr} M${mx[2]} ${by} V${my-mr}"/></g>`;
mx.forEach(x=>{ s+=`<circle cx="${x}" cy="${my}" r="${mr}" fill="none" stroke="${P}" stroke-opacity=".5" stroke-width="1.1"/>`;
  angs.forEach(a=>{const [px,py]=pt(x,my,mr,a); s+=`<line x1="${x}" y1="${my}" x2="${px}" y2="${py}" stroke="${P}" stroke-opacity=".4" stroke-width="1"/><circle cx="${px}" cy="${py}" r="3.6" fill="${BG}" stroke="${P}" stroke-opacity=".7" stroke-width="1.3"/>`});
  s+=`<rect x="${x-6}" y="${my-6}" width="12" height="12" transform="rotate(45 ${x} ${my})" fill="${P}" fill-opacity=".7"/>`;});
s+=T(cx,H-26,'OTHER CITIES',{s:13,w:700,ls:3.4,f:C});
// main network
s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${P}" stroke-opacity=".55" stroke-width="1.4"/>`;
nodes.forEach(([n,a])=>{const [x,y]=pt(cx,cy,R,a); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${P}" stroke-opacity=".6" stroke-width="1.4"/>`;});
nodes.forEach(([n,a,hi])=>{const [x,y]=pt(cx,cy,R,a);
  s+= hi?`<circle cx="${x}" cy="${y}" r="14" fill="${P}"/>`:`<circle cx="${x}" cy="${y}" r="10" fill="${BG}" stroke="${P}" stroke-width="2"/>`;
  if(a==-90) s+=T(x,y-28,n,{s:21,ls:4.2});
  else if(a==-18||a==198) s+=T(x,y-24,n,{});
  else s+=T(x,y+38,n,{});});
const pw=226,ph=40; s+=`<rect x="${cx-pw/2}" y="${cy-ph/2}" width="${pw}" height="${ph}" rx="${ph/2}" fill="${P}"/>`;
s+=T(cx,cy+5,'WARM SPRINGS HOUSE',{s:13,w:700,ls:2.6,f:'#f4f1eb'});
s+='</svg>'; m.innerHTML=s;});
</script></body></html>
